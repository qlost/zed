[package]
name = "etw_tracing"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lib]
path = "etw_tracing.rs"
test = false
doctest = false

[target.'cfg(target_os = "windows")'.dependencies]
anyhow.workspace = true
gpui.workspace = true
net.workspace = true
serde.workspace = true
serde_json.workspace = true
util.workspace = true
workspace.workspace = true

wprcontrol = { git = "https://github.com/qlost/wprcontrol.git", rev = "eca44db97c2ba8e1df6209103037cb6f577d3e09" }
windows-core = { git = "https://github.com/JustRustThings/windows-rs", branch = "stuff-0.62.2" }
windows = { git = "https://github.com/JustRustThings/windows-rs", branch = "stuff-0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
